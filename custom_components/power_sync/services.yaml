# Services for PowerSync integration
sync_tou_schedule:
  name: Sync TOU Schedule
  description: Manually refresh Time-of-Use tariff prices. Tesla systems upload the schedule; Modbus systems store it for PowerSync display and optimization.
  fields: {}

sync_now:
  name: Sync Now
  description: Immediately refresh data from Amber and Tesla
  fields: {}

set_connected_ev:
  name: Set connected EV
  description: Select the active vehicle profile for a shared non-Tesla charger. Clearing vehicle_id disables automated control until another profile is selected.
  fields:
    loadpoint_id:
      name: Physical loadpoint ID
      description: Canonical physical charger ID configured for the shared profiles.
      required: true
      selector:
        text:
    vehicle_id:
      name: Vehicle profile ID
      description: Profile bound to the physical charger. Omit or clear to select no vehicle.
      required: false
      selector:
        text:
    entry_id:
      name: Entry ID
      description: Optional PowerSync configuration entry ID.
      required: false
      selector:
        text:

preview_history_relink:
  name: Preview History Relink
  description: Preview Sungrow mkaiser-to-PowerSync entity relinks without changing entities.
  fields:
    entry_id:
      name: Entry ID
      description: Optional PowerSync config entry ID. Omit to use the Sungrow entry.
      required: false
      selector:
        text:

apply_history_relink:
  name: Apply History Relink
  description: Apply ready Sungrow mkaiser-to-PowerSync entity relinks. Does not rewrite recorder statistics.
  fields:
    entry_id:
      name: Entry ID
      description: Optional PowerSync config entry ID. Omit to use the Sungrow entry.
      required: false
      selector:
        text:
    confirm:
      name: Confirm
      description: Must be true to apply the relinks.
      required: true
      default: false
      selector:
        boolean:

force_discharge:
  name: Force Discharge
  description: Force battery discharge for a timed window. Paired Powerwalls use local power control first, with existing Tesla controls as a fallback.
  fields:
    duration:
      name: Duration
      description: Whole minutes from 1 to 1440 (24 hours). Choose a preset through 6 hours or enter a custom value. Device/provider limits still apply; Amber overrides support up to 240 minutes.
      required: false
      default: 30
      example: 60
      selector:
        select:
          custom_value: true
          options:
            - label: "15 minutes"
              value: "15"
            - label: "30 minutes"
              value: "30"
            - label: "45 minutes"
              value: "45"
            - label: "1 hour"
              value: "60"
            - label: "1 hour 15 min"
              value: "75"
            - label: "1 hour 30 min"
              value: "90"
            - label: "1 hour 45 min"
              value: "105"
            - label: "2 hours"
              value: "120"
            - label: "2 hours 15 min"
              value: "135"
            - label: "2 hours 30 min"
              value: "150"
            - label: "2 hours 45 min"
              value: "165"
            - label: "3 hours"
              value: "180"
            - label: "3 hours 15 min"
              value: "195"
            - label: "3 hours 30 min"
              value: "210"
            - label: "3 hours 45 min"
              value: "225"
            - label: "4 hours"
              value: "240"
            - label: "4 hours 15 min"
              value: "255"
            - label: "4 hours 30 min"
              value: "270"
            - label: "4 hours 45 min"
              value: "285"
            - label: "5 hours"
              value: "300"
            - label: "5 hours 15 min"
              value: "315"
            - label: "5 hours 30 min"
              value: "330"
            - label: "5 hours 45 min"
              value: "345"
            - label: "6 hours"
              value: "360"
    power_w:
      name: Power (W)
      description: Target power in watts. For paired Powerwalls this is grid export; battery output also accounts for home load and solar. 0 or omitted uses the configured maximum.
      required: false
      default: 0
      example: 5000
      selector:
        number:
          min: 0
          max: 50000
          step: 500
          unit_of_measurement: W

force_charge:
  name: Force Charge
  description: Force battery charging for a timed window. Paired Powerwalls use local power control first, with existing Tesla controls as a fallback.
  fields:
    duration:
      name: Duration
      description: Duration in minutes (15 minutes to 4 hours)
      required: false
      default: 30
      example: 60
      selector:
        select:
          options:
            - label: "15 minutes"
              value: "15"
            - label: "30 minutes"
              value: "30"
            - label: "45 minutes"
              value: "45"
            - label: "1 hour"
              value: "60"
            - label: "1 hour 15 min"
              value: "75"
            - label: "1 hour 30 min"
              value: "90"
            - label: "1 hour 45 min"
              value: "105"
            - label: "2 hours"
              value: "120"
            - label: "2 hours 15 min"
              value: "135"
            - label: "2 hours 30 min"
              value: "150"
            - label: "2 hours 45 min"
              value: "165"
            - label: "3 hours"
              value: "180"
            - label: "3 hours 15 min"
              value: "195"
            - label: "3 hours 30 min"
              value: "210"
            - label: "3 hours 45 min"
              value: "225"
            - label: "4 hours"
              value: "240"
    power_w:
      name: Power (W)
      description: Target power in watts. 0 or omitted means use the inverter's rated/BMS max.
      required: false
      default: 0
      example: 5000
      selector:
        number:
          min: 0
          max: 50000
          step: 500
          unit_of_measurement: W

restore_normal:
  name: Restore Normal
  description: Restore normal operation - restores saved tariff or triggers Amber sync for Amber users
  fields: {}

set_self_consumption:
  name: Set Self Consumption
  description: Set battery to pure self-consumption mode for a timed override (battery offsets home load, no TOU optimization)
  fields:
    duration:
      name: Duration
      description: Duration in minutes (15 minutes to 4 hours)
      required: false
      default: 30
      example: 60
      selector:
        select:
          options:
            - label: "15 minutes"
              value: "15"
            - label: "30 minutes"
              value: "30"
            - label: "45 minutes"
              value: "45"
            - label: "1 hour"
              value: "60"
            - label: "1 hour 15 min"
              value: "75"
            - label: "1 hour 30 min"
              value: "90"
            - label: "1 hour 45 min"
              value: "105"
            - label: "2 hours"
              value: "120"
            - label: "2 hours 15 min"
              value: "135"
            - label: "2 hours 30 min"
              value: "150"
            - label: "2 hours 45 min"
              value: "165"
            - label: "3 hours"
              value: "180"
            - label: "3 hours 15 min"
              value: "195"
            - label: "3 hours 30 min"
              value: "210"
            - label: "3 hours 45 min"
              value: "225"
            - label: "4 hours"
              value: "240"

set_backup_reserve:
  name: Set Backup Reserve
  description: Set the battery backup reserve percentage (0-100%). Supports both Tesla Powerwall and SigEnergy systems.
  fields:
    percent:
      name: Percent
      description: Backup reserve percentage
      required: true
      example: 20
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

set_operation_mode:
  name: Set Operation Mode
  description: Set Powerwall operation mode (Time-Based Control, Self-Consumption, or Backup-Only)
  fields:
    mode:
      name: Mode
      description: Operation mode
      required: true
      example: "autonomous"
      selector:
        select:
          options:
            - label: "Time-Based Control (TOU)"
              value: "autonomous"
            - label: "Self-Consumption"
              value: "self_consumption"
            - label: "Backup-Only"
              value: "backup"

set_grid_export:
  name: Set Grid Export
  description: Set grid export rule (controls when battery can export to grid)
  fields:
    rule:
      name: Export Rule
      description: Grid export rule
      required: true
      example: "pv_only"
      selector:
        select:
          options:
            - label: "Never"
              value: "never"
            - label: "Solar Only"
              value: "pv_only"
            - label: "Solar + Battery"
              value: "battery_ok"

set_grid_charging:
  name: Set Grid Charging
  description: Enable or disable grid charging (allow battery to charge from grid)
  fields:
    enabled:
      name: Enabled
      description: Enable grid charging
      required: true
      example: true
      selector:
        boolean:

set_storm_watch:
  name: Set Storm Watch
  description: Enable or disable Tesla Storm Watch (predictive pre-charging before severe weather). Only applicable to energy sites that support storm mode.
  fields:
    enabled:
      name: Enabled
      description: Enable Storm Watch
      required: true
      example: true
      selector:
        boolean:

set_off_grid_ev_reserve:
  name: Set Off-Grid EV Charging Reserve
  description: Set the percentage of battery capacity reserved for vehicle charging during a grid outage.
  fields:
    percent:
      name: Reserve Percent
      description: Percentage of battery capacity held for EV charging when off-grid (0-100)
      required: true
      example: 20
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

set_vpp_enrollment:
  name: Set VPP Program Enrollment
  description: Enroll or unenroll the Powerwall in a Tesla Virtual Power Plant / grid services program. Program availability is region-dependent.
  fields:
    program_id:
      name: Program ID
      description: Tesla program identifier (fetched from the site's programs list)
      required: true
      example: "tesla_electric"
      selector:
        text:
    enrolled:
      name: Enrolled
      description: True to enroll in the program, False to unenroll
      required: true
      example: true
      selector:
        boolean:

get_calendar_history:
  name: Get Calendar History
  description: Fetch energy history from the configured battery system for mobile app energy summaries
  fields:
    period:
      name: Period
      description: Time period for history (day, week, month, year)
      required: false
      default: "day"
      example: "week"
      selector:
        select:
          options:
            - label: "Day"
              value: "day"
            - label: "Week"
              value: "week"
            - label: "Month"
              value: "month"
            - label: "Year"
              value: "year"

sync_battery_health:
  name: Sync Battery Health
  description: Receive battery health data from mobile app TEDAPI scan and update sensors
  fields:
    original_capacity_wh:
      name: Original Capacity (Wh)
      description: Original battery capacity in Wh when new
      required: true
      example: 40500
      selector:
        number:
          min: 0
          max: 500000
          unit_of_measurement: Wh
    current_capacity_wh:
      name: Current Capacity (Wh)
      description: Current battery capacity in Wh
      required: true
      example: 38475
      selector:
        number:
          min: 0
          max: 500000
          unit_of_measurement: Wh
    degradation_percent:
      name: Degradation Percent
      description: Battery degradation percentage
      required: true
      example: 5.0
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: "%"
    battery_count:
      name: Battery Count
      description: Number of Powerwall units
      required: false
      default: 1
      example: 2
      selector:
        number:
          min: 1
          max: 20
    scanned_at:
      name: Scanned At
      description: ISO timestamp of when the scan was performed
      required: false
      example: "2024-12-23T10:30:00Z"
      selector:
        text:

powerwall_go_off_grid:
  name: Go Off-Grid (Local)
  description: >-
    Disconnect the Tesla Powerwall from the grid using direct local control.
    Requires the gateway to be paired via the mobile app's Battery Setup
    section. Refuses to run when battery SOC is below the configured safety
    floor (default 20%) unless bypass_soc_check is explicitly set. Works on
    Powerwall 2 (REST) and Powerwall 3 (TEDAPI v1r).
  fields:
    bypass_soc_check:
      name: Bypass SOC Safety Check
      description: >-
        Override the minimum-SOC refusal. Only use this if you know exactly
        what you're doing — you can strand your house on an empty battery.
      required: false
      default: false
      selector:
        boolean:

powerwall_get_battery_calibration_delay_status:
  name: Powerwall calibration delay status
  description: >-
    Read the paired LAN gateway's remaining calibration delay and deferral
    allowance. Unsupported firmware reports unavailable. This is read-only;
    it does not reset PowerSync's calibration guard.
  fields:
    entry_id:
      name: PowerSync entry
      description: Required when more than one PowerSync entry is configured.
      selector:
        text:

powerwall_delay_battery_calibration:
  name: Delay Powerwall calibration
  description: >-
    Request one calibration deferral in whole hours on supporting paired LAN
    gateways. Requires fresh status and an available deferral allowance. This
    may consume a limited gateway allowance. No automatic retries, Fleet
    fallback, cancellation or calibration-guard reset. Check the response and
    gateway status after a request; acceptance is separate from status readback.
  fields:
    delay_hours:
      name: Delay (hours)
      description: Positive whole hours; available values depend on gateway firmware.
      required: true
      selector:
        select:
          custom_value: true
          options:
            - label: 1 hour
              value: '1'
            - label: 2 hours
              value: '2'
            - label: 3 hours
              value: '3'
            - label: 6 hours
              value: '6'
            - label: 12 hours
              value: '12'
            - label: 24 hours
              value: '24'
    entry_id:
      name: PowerSync entry
      description: Required when more than one PowerSync entry is configured.
      selector:
        text:

powerwall_set_on_grid_solar_curtailment:
  name: Allow on-grid solar curtailment (Powerwall)
  description: >-
    Save the paired gateway's permission to reduce solar while grid-connected.
    Use with a zero/limited-export policy. This does not switch off all PV or
    control an independent AC-coupled inverter. Requires LAN access and confirms
    gateway setting readback; it has no Fleet API fallback. The setting persists
    until explicitly changed, including across Home Assistant restarts.
  fields:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
    entry_id:
      name: PowerSync entry
      description: Required when more than one PowerSync entry is configured.
      selector:
        text:

powerwall_reconnect_grid:
  name: Reconnect to Grid (Local)
  description: >-
    Reconnect the Tesla Powerwall to the grid after an intentional islanding.
    Works on paired Powerwall 2 (REST) and Powerwall 3 (TEDAPI v1r). Safe to
    call while already on-grid — the gateway will no-op.
  fields: {}

schedule_max_backup:
  name: Schedule Max Backup
  description: >-
    Charge the Powerwall to 100% for a fixed window then restore the previous
    backup reserve. Use ahead of forecast outages or storms. Calling again while
    a window is active replaces the schedule and preserves the original reserve.
  fields:
    duration_minutes:
      name: Duration (minutes)
      description: How long to hold the reserve at 100% before restoring (1-1440).
      required: true
      example: 120
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box

refresh_calibration:
  name: Refresh Calibration
  description: >-
    Clear PowerSync's calibration_suspected flag. Use after a Powerwall
    calibration cycle completes if the optimiser hasn't auto-cleared the flag,
    or to retry mode toggles immediately. Doesn't touch the Powerwall — purely
    resets the integration's local guard.
  fields: {}

reconcile_solaredge_control:
  name: Reconcile SolarEdge control
  description: Read fresh storage settings through SolarEdge Modbus Multi and clear the persistent control block only when a safe baseline is verified. Run under supervision after inspecting the inverter. This service does not write inverter settings.
  fields:
    entry_id:
      name: PowerSync entry
      description: Config entry ID of the PowerSync SolarEdge battery.
      required: true
      selector:
        text:
    acknowledge:
      name: Acknowledge supervised recovery
      description: Confirm that you have inspected the inverter and are supervising this recovery.
      required: true
      default: false
      selector:
        boolean:

preserve_battery:
  name: Preserve Battery
  description: Hold the current battery charge with a timed native Amber Smart Shift override. Does not change the hardware reserve.
  fields:
    entry_id:
      name: PowerSync entry ID
      required: true
      selector:
        text:
    duration:
      name: Duration
      default: 30
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min

get_teslemetry_charge_on_solar:
  name: Read native Tesla Charge on Solar
  description: >-
    Read native Tesla Charge on Solar through PowerSync Fleet or the selected
    Teslemetry vehicle provider. Requires provider virtual-key pairing. Provider
    request costs apply; Teslemetry may wake the car. A confirmed disabled read
    releases the PowerSync EV control hold.
  fields:
    entry_id:
      name: PowerSync integration
      required: true
      selector:
        config_entry:
          integration: power_sync
    vin:
      name: Vehicle VIN
      required: true
      selector:
        text:

set_teslemetry_charge_on_solar:
  name: Set native Tesla Charge on Solar
  description: >-
    Enable or disable Tesla-managed solar charging and read back the settings.
    Requires a compatible Tesla, Powerwall, Tesla app setup and the provider virtual
    key. Turn off PowerSync EV sessions first. Writes are blocked in monitoring
    mode. Sends a write followed by settings readback; provider request costs apply.
    Uncertain results retain the PowerSync EV control hold until disabled readback.
  fields:
    entry_id:
      name: PowerSync integration
      required: true
      selector:
        config_entry:
          integration: power_sync
    vin:
      name: Vehicle VIN
      required: true
      selector:
        text:
    confirm_eligible:
      name: Confirm native solar requirements
      description: Required when enabling. Tesla setup is complete at a Powerwall site without export or site limits, other charging controllers are off, and request costs are accepted. Native mode does not enforce PowerSync phase or grid-import limits.
      default: false
      selector:
        boolean:
    enabled:
      name: Enable native Charge on Solar
      required: true
      selector:
        boolean:
    lower_charge_limit:
      name: Lower charge limit (solar and grid)
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: '%'
    upper_charge_limit:
      name: Upper charge limit (excess solar)
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: '%'
