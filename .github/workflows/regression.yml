name: PowerSync Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  plan:
    # Only trusted main code gets cancellation permission, never PR code.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    outputs:
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - name: Preserve matching work and cancel obsolete main runs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/regression_gate.py plan

  regression:
    needs: plan
    if: always() && !cancelled() && (github.event_name == 'pull_request' || needs.plan.result == 'success')
    name: Full regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    # Metadata bumps queue behind identical content, then reuse its success.
    # New code cancels older content in the trusted plan job above.
    concurrency:
      group: regression-${{ github.event.pull_request.number || needs.plan.outputs.fingerprint }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.10.0'
      - name: Find trusted matching evidence
        id: evidence
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/regression_gate.py find
      - name: Install regression dependencies
        if: steps.evidence.outputs.reuse != 'true'
        run: python -m pip install -r requirements-test.txt
      - name: Run full regression suite
        if: steps.evidence.outputs.reuse != 'true'
        run: |
          python -m pytest tests/ -q -p no:cacheprovider --durations=30 --junitxml=regression-results.xml
          python scripts/release/check_regression_results.py regression-results.xml
