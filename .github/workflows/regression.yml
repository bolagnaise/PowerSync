name: PowerSync Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A newer main/PR revision replaces obsolete verification. Release publication
# waits for evidence separately and is never part of this cancellation group.
concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Full regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.10.0'
      - name: Find trusted matching evidence
        id: evidence
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/regression_gate.py find
      - name: Install regression dependencies
        if: steps.evidence.outputs.reuse != 'true'
        run: python -m pip install -r requirements-test.txt
      - name: Run full regression suite
        if: steps.evidence.outputs.reuse != 'true'
        run: |
          python -m pytest tests/ -q -p no:cacheprovider --durations=30 --junitxml=regression-results.xml
          python scripts/release/check_regression_results.py regression-results.xml
